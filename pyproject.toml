[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-matching"
version = "0.1.0"
description = "Customer matching and POS cross-reference tool"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "duckdb",
    "pandas"
]

[tool.setuptools.packages.find]
where = ["src"]